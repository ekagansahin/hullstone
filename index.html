<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hullstone</title>
    <meta name="description" content="Design low-poly, flat-bottomed stones in your browser and export them as STL for 3D printing." />
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <!-- Web version: the same Streamlit app, running fully in the browser with stlite (Pyodide). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Hullstone needs JavaScript to run in the browser.</noscript>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";

      mount(
        {
          requirements: ["numpy", "pandas", "scipy", "plotly"],
          entrypoint: "hullstone_app.py",
          // Loaded from this repository, so the web and local versions always match.
          files: {
            "hullstone_app.py": { url: "./hullstone_app.py" },
            "i18n.py": { url: "./i18n.py" },
            "assets/icon.png": { url: "./assets/icon.png" },
          },
          streamlitConfig: {
            "client.toolbarMode": "minimal",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
